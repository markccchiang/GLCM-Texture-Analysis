# Continuous integration (doc/ui-design-plan.md, sections 8.3 and 8.6): core, addon, server, web and end-to-end tests
# on macOS (arm64) and Ubuntu (x86_64), and the Docker image with a smoke test.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install C++ dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libopencv-dev libeigen3-dev nlohmann-json3-dev libgtest-dev

      - name: Install C++ dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv eigen nlohmann-json googletest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Core library and tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Install npm packages
        run: npm ci

      - name: Build the Node-API addon
        run: npm run build:native

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (addon, server, web)
        run: npm test

      - name: End-to-end tests (Chromium, WebKit)
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:e2e

      - name: Keep test results of failed runs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        run: docker build -t glcm-texture-analysis .

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Smoke test in server mode
        run: |
          export GLCM_API_TOKEN="$(openssl rand -base64 32)"
          docker run -d --name glcm -p 8080:8080 -e GLCM_API_TOKEN glcm-texture-analysis
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/v1/health && break
            sleep 2
          done
          node scripts/smoke-test.mjs http://127.0.0.1:8080

      - name: Container logs
        if: always()
        run: docker logs glcm || true
