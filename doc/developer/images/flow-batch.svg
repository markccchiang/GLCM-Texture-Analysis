  <text x="770.0" y="487.0" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="middle">ZIP, one CSV per group</text>
  <text x="770.0" y="503.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">zipped with fflate</text>
  <text x="620.0" y="610.0" font-size="10.5" fill="#64748b" font-weight="700" letter-spacing="0.08em">LEGEND</text>
