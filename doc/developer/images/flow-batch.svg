  <text x="222.0" y="649.0" font-size="12" fill="#1e293b" font-weight="600" text-anchor="middle">Settings valid?</text>
  <path d="M332.0,645.0 L430.0,645.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="344.0" y="636.0" font-size="11" fill="#64748b" font-weight="600">no</text>
  <rect x="435.0" y="632" width="70.0" height="26" rx="13" fill="#fde8e8" stroke="#c23b3b" stroke-width="1.2"/>
  <text x="470.0" y="649.0" font-size="11.5" fill="#c23b3b" font-weight="700" text-anchor="middle">Failed</text>
  <text x="470.0" y="674.0" font-size="10.5" fill="#64748b" text-anchor="middle">recorded; next image</text>
  <path d="M222.0,677.0 L222.0,708.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="232.0" y="696.0" font-size="11" fill="#64748b" font-weight="600">yes</text>
  <g filter="url(#shadow)"><rect x="77.0" y="710.0" width="290" height="50" rx="10" fill="#edf8f1" stroke="#b7e2c8" stroke-width="1.4"/></g>
  <text x="222.0" y="732.0" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="middle">Start the analysis</text>
  <text x="222.0" y="748.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">POST /analyses · run in the table</text>
  <path d="M222.0,760.0 L222.0,798.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
