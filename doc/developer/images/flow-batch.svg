  <text x="770.0" y="413.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace"># images=N</text>
  <path d="M870.0,296.0 L918.0,296.0 L918.0,490.0 L897.0,490.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="878.0" y="287.0" font-size="11" fill="#64748b" font-weight="600">no</text>
