  <g filter="url(#shadow)"><rect x="620.0" y="85.0" width="300" height="50" rx="10" fill="#edf8f1" stroke="#b7e2c8" stroke-width="1.4"/></g>
  <text x="770.0" y="107.0" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="middle">Fetch each finished result</text>
  <text x="770.0" y="123.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">GET /analyses/{id}/results.csv</text>
  <path d="M770.0,135.0 L770.0,170.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="620.0" y="172.0" width="300" height="50" rx="10" fill="#eef4fe" stroke="#bcd2f7" stroke-width="1.4"/></g>
  <text x="770.0" y="194.0" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="middle">Merge the CSV texts</text>
  <text x="770.0" y="210.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">mergeCsv.ts · same settings and header</text>
  <path d="M770.0,222.0 L770.0,262.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><polygon points="770,264.0 870.0,296 770,328.0 670.0,296" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/></g>
  <text x="770.0" y="300.0" font-size="12" fill="#1e293b" font-weight="600" text-anchor="middle">One group?</text>
  <path d="M770.0,328.0 L770.0,373.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="780.0" y="356.0" font-size="11" fill="#64748b" font-weight="600">yes</text>
  <g filter="url(#shadow)"><rect x="650.0" y="375.0" width="240" height="50" rx="10" fill="#eef4fe" stroke="#bcd2f7" stroke-width="1.4"/></g>
