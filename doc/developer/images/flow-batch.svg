  <text x="222.0" y="469.0" font-size="12" fill="#1e293b" font-weight="600" text-anchor="middle">Any ROI left?</text>
  <path d="M332.0,465.0 L426.0,465.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="344.0" y="456.0" font-size="11" fill="#64748b" font-weight="600">no</text>
  <rect x="431.9" y="452" width="76.3" height="26" rx="13" fill="#fdf3dc" stroke="#9a6212" stroke-width="1.2"/>
  <text x="470.0" y="469.0" font-size="11.5" fill="#9a6212" font-weight="700" text-anchor="middle">Skipped</text>
  <text x="470.0" y="494.0" font-size="10.5" fill="#64748b" text-anchor="middle">recorded; next image</text>
  <path d="M222.0,497.0 L222.0,528.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="232.0" y="516.0" font-size="11" fill="#64748b" font-weight="600">yes</text>
  <g filter="url(#shadow)"><rect x="77.0" y="530.0" width="290" height="50" rx="10" fill="#eef4fe" stroke="#bcd2f7" stroke-width="1.4"/></g>
