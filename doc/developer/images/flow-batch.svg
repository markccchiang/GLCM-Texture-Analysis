<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 980" width="960" height="980" role="img" aria-labelledby="title desc" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="title">Batch measurement</title>
  <desc id="desc">For each image file, the browser computes its SHA-256 and reuses an image the server already stores, otherwise it uploads the file with POST /images. The ROIs are clipped to the image; without an ROI left the image is skipped. The settings are fitted to the bit depth; invalid settings mark the image failed. Otherwise POST /analyses starts the analysis, whose run is added to the Results table, and the browser polls GET /analyses/{id}/results until the results are final, or cancels with DELETE /analyses/{id}; then the next image follows. Download combined CSV fetches GET /analyses/{id}/results.csv for each finished image, merges files with the same settings and header, and saves one CSV file, or a ZIP with one CSV per group of settings.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="960" height="980" fill="#ffffff"/>
  <rect x="20" y="20" width="560" height="940" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="600" y="20" width="340" height="530" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="600" y="580" width="340" height="150" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="40.0" y="50.0" font-size="10.5" fill="#64748b" font-weight="700" letter-spacing="0.08em">FOR EACH IMAGE FILE</text>
  <text x="560.0" y="50.0" font-size="11" fill="#64748b" text-anchor="end" font-family="'SFMono-Regular', Menlo, Consolas, monospace">batch/runBatch.ts</text>
  <g filter="url(#shadow)"><rect x="77.0" y="80.0" width="290" height="50" rx="10" fill="#eef4fe" stroke="#bcd2f7" stroke-width="1.4"/></g>
  <text x="222.0" y="102.0" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="middle">SHA-256 of the file</text>
  <text x="222.0" y="118.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">Web Crypto, in the browser</text>
  <path d="M222.0,130.0 L222.0,154.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><polygon points="222,155.0 352.0,190 222,225.0 92.0,190" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/></g>
  <text x="222.0" y="189.0" font-size="12" fill="#1e293b" font-weight="600" text-anchor="middle">Already stored?</text>
  <text x="222.0" y="204.0" font-size="10" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">GET /images?sha256=</text>
  <path d="M352.0,190.0 L395.0,190.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="362.0" y="181.0" font-size="11" fill="#64748b" font-weight="600">yes</text>
  <g filter="url(#shadow)"><rect x="397.0" y="167.0" width="170" height="46" rx="10" fill="#edf8f1" stroke="#b7e2c8" stroke-width="1.4"/></g>
  <text x="482.0" y="194.5" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="middle">Reuse the image</text>
  <path d="M222.0,225.0 L222.0,258.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="232.0" y="246.0" font-size="11" fill="#64748b" font-weight="600">no</text>
  <g filter="url(#shadow)"><rect x="77.0" y="260.0" width="290" height="50" rx="10" fill="#edf8f1" stroke="#b7e2c8" stroke-width="1.4"/></g>
  <text x="222.0" y="282.0" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="middle">Upload the file</text>
  <text x="222.0" y="298.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">POST /images</text>
  <path d="M222.0,310.0 L222.0,348.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M482.0,213.0 L482.0,375.0 L369.0,375.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="77.0" y="350.0" width="290" height="50" rx="10" fill="#eef4fe" stroke="#bcd2f7" stroke-width="1.4"/></g>
  <text x="222.0" y="372.0" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="middle">Clip the ROIs to the image</text>
  <text x="222.0" y="388.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">prepareRoiImport</text>
  <path d="M222.0,400.0 L222.0,432.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
