  <text x="222.0" y="568.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">adaptToImage · checkSettings</text>
  <path d="M222.0,580.0 L222.0,612.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
