  <text x="762.0" y="296.0" font-size="11.5" fill="#1e293b" text-anchor="end" font-family="'SFMono-Regular', Menlo, Consolas, monospace">statistics per ROI</text>
  <line x1="475" y1="344.0" x2="167" y2="344.0" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
