  <text x="160.0" y="70.0" font-size="11" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">web/src</text>
  <g filter="url(#shadow)"><rect x="360" y="20" width="240" height="62" rx="12" fill="#edf8f1" stroke="#2e9d62" stroke-width="1.5"/></g>
  <path d="M360,32 A12,12 0 0 1 372,20 H588 A12,12 0 0 1 600,32 V50 H360 Z" fill="#2e9d62"/>
  <text x="480.0" y="40.0" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">API server</text>
  <text x="480.0" y="70.0" font-size="11" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">server/src</text>
  <g filter="url(#shadow)"><rect x="680" y="20" width="240" height="62" rx="12" fill="#fff5e8" stroke="#e07b00" stroke-width="1.5"/></g>
  <path d="M680,32 A12,12 0 0 1 692,20 H908 A12,12 0 0 1 920,32 V50 H680 Z" fill="#e07b00"/>
  <text x="800.0" y="40.0" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">Addon · C++ core</text>
  <text x="800.0" y="70.0" font-size="11" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">@glcm/native · glcm_core</text>
