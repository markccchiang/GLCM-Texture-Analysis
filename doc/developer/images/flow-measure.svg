  <circle cx="458" cy="511.0" r="9" fill="#2e9d62"/>
  <text x="458.0" y="514.5" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">7</text>
  <text x="442.0" y="515.0" font-size="11.5" fill="#1e293b" text-anchor="end" font-family="'SFMono-Regular', Menlo, Consolas, monospace">202 AnalysisInfo</text>
