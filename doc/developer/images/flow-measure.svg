  <rect x="676.1" y="466.0" width="247.8" height="27" rx="8" fill="#fff5e8" stroke="#f5cf9c" stroke-width="1.2"/>
  <text x="800.0" y="485.0" font-size="11" fill="#334155" text-anchor="middle">parse and validate ROIs and settings</text>
