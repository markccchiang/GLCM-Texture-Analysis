  <line x1="475" y1="835.0" x2="167" y2="835.0" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <circle cx="458" cy="821.0" r="9" fill="#2e9d62"/>
  <text x="458.0" y="824.5" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">12</text>
