<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1055" width="960" height="1055" role="img" aria-labelledby="title desc" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="title">Measuring</title>
  <desc id="desc">While ROIs change, the browser sends debounced POST /images/{id}/roi-stats requests; the server calls roiStats, which rasterizes each ROI, and returns pixel counts for the ROI Manager. To measure, the browser sends POST /analyses; the server validates the request with validateAnalysis, answers 202 with AnalysisInfo and queues one job per ROI and distance. The browser reads GET /analyses/{id}/events: for each job the server calls runAnalysis and sends result and progress events, then a finished event after storing results/&lt;id&gt;.json. Finally the browser fetches the ordered results with GET /analyses/{id}/results and appends rows to the Results table.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="960" height="1055" fill="#ffffff"/>
